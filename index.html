async function loadBookings(){
  try{
    const res=await fetch(`${SUPABASE_URL}/rest/v1/Bookings?select=car_id,start_dt,end_dt`,{headers:SB_HEADERS});
    if(!res.ok)return[];
    const data=await res.json();
    return Array.isArray(data)?data.map(b=>({carId:b.car_id,startDT:b.start_dt,endDT:b.end_dt})):[];
  }catch{return[];}
}

async function saveBookingToSupabase(booking){
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/Bookings`,{
      method:'POST',
      headers:{...SB_HEADERS,'Prefer':'return=minimal'},
      body:JSON.stringify({
        car_id:booking.carId,start_dt:booking.startDT,end_dt:booking.endDT,
        name:booking.name,phone:booking.phone,
        destinations:Array.isArray(booking.destinations)?booking.destinations.join(', '):'',
        delivery_type:booking.deliveryType||'',delivery_address:booking.deliveryAddress||'',
      }),
    });
  }catch(e){console.error(e);}
}

function computeRentalFee(carId,zone,durationMs){
  if(!zone||!carId||!durationMs)return null;
  const rates=RATES[`zone${zone}`]?.[carId];
  if(rates===null)return{available:false};
  if(!rates)return null;
  const totalHrs=durationMs/3600000,days=Math.floor(totalHrs/24),rem=totalHrs%24;
  const items=[];let total=0,e=0.01;
  if(days>0){const a=days*rates.h24;items.push({l:`${days} day${days>1?"s":""}  ×  ₱${rates.h24.toLocaleString()}`,a});total+=a;}
  if(rem>e){
    if(rates.h12&&rem>=12){
      items.push({l:`1 half-day  ×  ₱${rates.h12.toLocaleString()}`,a:rates.h12});total+=rates.h12;
      const left=rem-12;
      if(left>e){const c=Math.ceil(left),a=c*rates.h1;items.push({l:`${c} hr${c>1?"s":""}  ×  ₱${rates.h1}`,a});total+=a;}
    }else{const c=Math.ceil(rem),a=c*rates.h1;items.push({l:`${c} hr${c>1?"s":""}  ×  ₱${rates.h1}`,a});total+=a;}
  }
  return{available:true,items,total};
}

function formatDuration(ms){
  if(!ms||ms<=0)return null;
  const m=Math.floor(ms/60000),d=Math.floor(m/1440),h=Math.floor((m%1440)/60),mn=m%60;
  return[d&&`${d} day${d>1?"s":""}`,h&&`${h} hr${h>1?"s":""}`,mn&&`${mn} min`].filter(Boolean).join(" ");
}
function formatDT(d,t){
  if(!d||!t)return"";
  return new Date(`${d}T${t}`).toLocaleString("en-PH",{weekday:"short",month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit",hour12:true});
}
function overlaps(aS,aE,bS,bE){return new Date(aS)<new Date(bE)&&new Date(aE)>new Date(bS);}
function nowPHT(){return new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Manila"}));}
function today(){return nowPHT().toISOString().split("T")[0];}
function isPastDateTime(dateStr,timeStr){
  if(!dateStr||!timeStr)return false;
  return new Date(`${dateStr}T${timeStr}`)<=nowPHT();
}

async function callClaude(messages,maxTokens=400){
  const res=await fetch("/api/claude",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:maxTokens,messages}),
  });
  return res.json();
}

const inp={width:"100%",maxWidth:"100%",background:"rgba(255,255,255,0.05)",border:"2px solid rgba(255,255,255,0.12)",borderRadius:"12px",padding:"13px 16px",color:"#fff",fontSize:"15px",outline:"none",boxSizing:"border-box",colorScheme:"dark",display:"block"};
const lbl={color:"rgba(255,255,255,0.55)",fontSize:"13px",fontWeight:600,display:"block",marginBottom:"8px"};
const hi=e=>e.target.style.borderColor="#a78bfa",lo=e=>e.target.style.borderColor="rgba(255,255,255,0.12)";

const TERMS_SECTIONS=[
  {title:"1. Rental Terms",items:["Rental Period: As agreed upon booking confirmation","Rental Rate: Based on the selected vehicle and destination zone","Mileage: Unlimited mileage within the agreed destination(s)"]},
  {title:"2. Payment Terms",items:["The Lessee agrees to pay the total rental amount based on the agreed rate and rental period. No security deposit is required unless otherwise stated by the Lessor.","Additional charges as specified in this Agreement shall be payable upon vehicle return."]},
  {title:"3. Insurance and Damage Liability",items:["The rented vehicle is covered by comprehensive insurance.","In case of an accident, the Lessee shall pay the applicable insurance participation fee.","If the vehicle requires repairs and cannot be used for rental, the Lessee shall pay an amount equivalent to the daily rental rate multiplied by the number of days the vehicle remains unavailable.","Damages due to negligence, unauthorized use, or violation of this Agreement shall be the sole responsibility of the Lessee, beyond insurance coverage."]},
  {title:"4. Late Return",items:["If the vehicle is returned later than the agreed time, additional charges shall apply.","The amount of late return fees shall be determined by the Lessor upon return."]},
  {title:"5. Minor Damages and Additional Fees",items:["Flat Tire: Must be repaired immediately at the Lessee's expense at a licensed vulcanizing shop. Failure to do so incurs a ₱500 penalty upon return.","Damaged Tire: Full replacement cost matching the original brand and specifications.","Lost or Damaged Tools/Accessories (jack, spare tire, wrench, etc.): Full replacement cost based on market value.","Cleaning Fee: ₱200 for excessive dirt, stains, or foul odors.","Smoking Fine: ₱2,000 if evidence of smoking is found inside the vehicle.","Lost Key: Full cost of replacement and reprogramming, depending on the vehicle model.","Fuel Charge: ₱300 per missing fuel bar based on the fuel gauge at the time of release.","Minor Scratches per Panel: ₱3,500, except for the roof, hood, and rear/back door, which shall be charged at full repair cost.","Damages to Lights, Door Handles, and Glass Components (windows, windshield, etc.): Full market/replacement price.","All such charges shall be payable immediately upon vehicle return."]},
  {title:"6. Use of Vehicle",items:["Smoking inside the vehicle is strictly prohibited at all times.","No ferry or sea crossing is allowed without prior written approval from the Lessor.","The vehicle shall not be used for any illegal activities or in violation of Philippine laws.","Only drivers with a valid driver's license may operate the vehicle.","The Lessee is responsible for all traffic violations, penalties, and towing charges incurred during the rental period.","The Lessee shall maintain the cleanliness and good condition of the vehicle throughout the rental period."]},
  {title:"7. Breakdown and Accidents",items:["In case of mechanical breakdown or accident, the Lessee must immediately notify the Lessor.","Unauthorized repairs are strictly prohibited without prior approval from the Lessor.","The Lessor will provide assistance as necessary; however, towing or repair costs due to the Lessee's negligence shall be the Lessee's responsibility."]},
  {title:"8. Termination",items:["The Lessor reserves the right to terminate this Agreement without refund if the Lessee violates any terms herein, including but not limited to misuse of the vehicle, negligence, or illegal activity."]},
  {title:"9. Governing Law",items:["This Agreement shall be governed by and construed in accordance with the laws of the Republic of the Philippines."]},
  {title:"10. Entire Agreement",items:["This Agreement constitutes the entire understanding between the parties and supersedes any prior discussions or agreements.","Amendments or modifications must be made in writing and signed by both parties."]},
];

function App(){
  const[step,setStep]=useState(1);
  const[bookings,setBookings]=useState([]);
  const[destInput,setDestInput]=useState("");
  const[submitted,setSubmitted]=useState(false);
  const[submitting,setSubmitting]=useState(false);
  const[agreedToTerms,setAgreedToTerms]=useState(false);
  const[showTerms,setShowTerms]=useState(false);
  const[zoneState,setZoneState]=useState({loading:false,error:null,zone:null,perDest:[]});
  const zoneRef=useRef(null);

  const[form,setForm]=useState({
    startDate:"",startTime:"",endDate:"",endTime:"",
    car:null,deliveryType:null,deliveryAddress:"",
    destinations:[],name:"",phone:"",notes:"",
  });
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));

  useEffect(()=>{loadBookings().then(setBookings);},[]);

  useEffect(()=>{
    if(!form.destinations.length){setZoneState({loading:false,error:null,zone:null,perDest:[]});return;}
    setZoneState(s=>({...s,loading:true,error:null}));
    clearTimeout(zoneRef.current);
    zoneRef.current=setTimeout(()=>classifyZones(form.destinations),800);
  },[form.destinations]);

  const classifyZones=async(dests)=>{
    try{
      const data=await callClaude([{role:"user",content:
        `Classify these destinations from San Pedro, Laguna, Philippines into zones:\n\nDestinations: ${dests.join(", ")}\n\nZone 1: NCR (Metro Manila), nearby Laguna (Biñan, Sta Rosa, Calamba, Los Baños, Cabuyao, etc.), nearby Cavite (Bacoor, Imus, Dasmariñas, Gen Trias, etc.), nearby Rizal (Antipolo, Cainta, Taytay, Angono, etc.), Tagaytay\nZone 2: Far Laguna (Pagsanjan, Lumban, Siniloan, etc.), far Cavite (Trece Martires, Amadeo, Silang, etc.), far Rizal (Tanay, Teresa, etc.), Batangas, Nearby Quezon Province (Lucena, Pagbilao, etc.)\nZone 3: Pampanga, Tarlac, Bataan, Bulacan, Zambales, Subic, Far Quezon Province (Infanta, Real, Atimonan, etc.)\nZone 4: Baguio City, Pangasinan (all cities/municipalities), La Union\nZone 5: North Luzon beyond Zone 4, Ilocos Region, Higher parts of Baguio, Other parts of Bicol Region, Tuguegarao, Cagayan Valley\n\nReply ONLY with valid JSON (no markdown):\n{"perDest":[{"name":"...","zone":1}],"highestZone":1}`
      }]);
      const text=data.content?.[0]?.text?.trim()||"";
      const parsed=JSON.parse(text.replace(/```json|```/g,"").trim());
      setZoneState({loading:false,error:null,zone:parsed.highestZone,perDest:parsed.perDest||[]});
    }catch{setZoneState({loading:false,error:"Hindi ma-classify ang destination. Subukan ulit.",zone:null,perDest:[]});}
  };

  const startDT=form.startDate&&form.startTime?`${form.startDate}T${form.startTime}`:null;
  const endDT=form.endDate&&form.endTime?`${form.endDate}T${form.endTime}`:null;
  const durationMs=startDT&&endDT?new Date(endDT)-new Date(startDT):0;
  const duration=formatDuration(durationMs);
  const endBeforeStart=!!(endDT&&startDT&&new Date(endDT)<=new Date(startDT));
  const unavailableCars=useMemo(()=>{
    if(!startDT||!endDT||endBeforeStart)return new Set();
    return new Set(bookings.filter(b=>overlaps(startDT,endDT,b.startDT,b.endDT)).map(b=>b.carId));
  },[startDT,endDT,bookings,endBeforeStart]);
  const rentalFee=useMemo(()=>computeRentalFee(form.car,zoneState.zone,durationMs),[form.car,zoneState.zone,durationMs]);
  const selectedCar=CARS.find(c=>c.id===form.car);
  const zoneInfo=zoneState.zone?ZONE_INFO[zoneState.zone]:null;

  const addDest=()=>{const d=destInput.trim();if(d&&!form.destinations.includes(d)){set("destinations",[...form.destinations,d]);setDestInput("");}};
  const removeDest=i=>set("destinations",form.destinations.filter((_,idx)=>idx!==i));

  const canNext=()=>{
    if(step===1){const isPastStart=isPastDateTime(form.startDate,form.startTime);return!!form.startDate&&!!form.startTime&&!!form.endDate&&!!form.endTime&&!endBeforeStart&&durationMs>0&&!isPastStart;}
    if(step===2)return!!form.car;
    if(step===3)return!!form.deliveryType&&(form.deliveryType==="pickup"||form.deliveryAddress.trim().length>0);
    if(step===4)return form.destinations.length>0&&!zoneState.loading&&!!zoneState.zone&&(rentalFee===null||rentalFee?.available!==false);
    if(step===5)return form.name.trim()&&form.phone.trim();
    if(step===6)return agreedToTerms;
    return true;
  };

  const progress=((step-1)/(TOTAL_STEPS-1))*100;

  const handleConfirm=async()=>{
    setSubmitting(true);
    const booking={carId:form.car,startDT,endDT,name:form.name,phone:form.phone,destinations:form.destinations,deliveryType:form.deliveryType,deliveryAddress:form.deliveryAddress};
    await saveBookingToSupabase(booking);
    const updated=await loadBookings();
    setBookings(updated);
    if(FORMSPREE_ID!=="YOUR_FORMSPREE_ID"){
      try{
        await fetch(`https://formspree.io/f/${FORMSPREE_ID}`,{
          method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({
            _subject:`New Booking — ${selectedCar?.name}`,
            vehicle:`${selectedCar?.name} (${selectedCar?.type} · ${selectedCar?.seats})`,
            pickup:formatDT(form.startDate,form.startTime),
            return_time:formatDT(form.endDate,form.endTime),
            duration,
            service:form.deliveryType==="delivery"?`Delivery → ${form.deliveryAddress}`:"Pick-up (San Pedro, Laguna)",
            destinations:form.destinations.join(", "),
            estimated_rental:rentalFee?.available&&rentalFee?.total?`₱${rentalFee.total.toLocaleString()} (unlimited mileage)`:"To be confirmed",
            client_name:form.name,client_phone:form.phone,notes:form.notes||"—",
          }),
        });
      }catch(e){console.error("Formspree:",e);}
    }
    setSubmitting(false);
    setSubmitted(true);
  };

  const reset=()=>{
    setSubmitted(false);setStep(1);setDestInput("");
    setAgreedToTerms(false);setShowTerms(false);
    setZoneState({loading:false,error:null,zone:null,perDest:[]});
    setForm({startDate:"",startTime:"",endDate:"",endTime:"",car:null,deliveryType:null,deliveryAddress:"",destinations:[],name:"",phone:"",notes:""});
  };

  const summaryRows=[
    ["🚗 Vehicle",`${selectedCar?.name} · ${selectedCar?.type} · ${selectedCar?.seats}`],
    ["📍 Start",formatDT(form.startDate,form.startTime)],
    ["🏁 Return",formatDT(form.endDate,form.endTime)],
    ["⏱️ Duration",duration],
    ["🚚 Service",form.deliveryType==="delivery"?`Delivery → ${form.deliveryAddress}`:"Pick-up (San Pedro, Laguna)"],
    ...(form.deliveryType==="delivery"?[["🚚 Delivery Fee","To be confirmed by owner"]]:[]),
    ["📌 Destinations",form.destinations.join(", ")],
    ...(rentalFee?.available&&rentalFee?.total!=null?[["💰 Est. Rental Fee",`₱${rentalFee.total.toLocaleString()} (unlimited mileage)`]]:[]),
    ["👤 Name",form.name],["📞 Phone",form.phone],
    ...(form.notes?[["📝 Notes",form.notes]]:[]),
  ];

  if(submitted)return(
    <Wrap><Card>
      <div style={{textAlign:"center"}}>
        <div style={{fontSize:"56px",marginBottom:"12px"}}>🎉</div>
        <h2 style={{color:"#fff",fontSize:"24px",fontWeight:800,margin:"0 0 8px"}}>Booking Received!</h2>
        <p style={{color:"rgba(255,255,255,0.45)",marginBottom:"28px",lineHeight:1.6}}>Salamat, <strong style={{color:"#a78bfa"}}>{form.name}</strong>!<br/>We'll reach out to confirm your reservation.</p>
      </div>
      <div style={{background:"rgba(245,158,11,0.1)",border:"1px solid rgba(245,158,11,0.35)",borderRadius:"14px",padding:"16px",marginBottom:"20px",display:"flex",gap:"10px",alignItems:"flex-start"}}>
        <span style={{fontSize:"18px",flexShrink:0}}>⚠️</span>
        <p style={{color:"rgba(255,255,255,0.8)",fontSize:"13px",lineHeight:1.6,margin:0}}>
          <strong style={{color:"#f59e0b"}}>Heads up!</strong> This is not yet a booking confirmation. We'll reach out to you shortly to confirm your reservation. Please note that the rental fee displayed is an estimate only — the actual rate will be confirmed by the owner.
        </p>
      </div>
      <SummaryBox rows={summaryRows}/>
      <button onClick={reset} style={{marginTop:"22px",width:"100%",background:"linear-gradient(135deg,#a78bfa,#7c3aed)",border:"none",color:"#fff",padding:"14px",borderRadius:"50px",fontSize:"15px",fontWeight:700,cursor:"pointer"}}>New Booking</button>
    </Card></Wrap>
  );

  return(
    <Wrap>
      {showTerms&&<TermsModal onClose={()=>setShowTerms(false)} onAgree={()=>{setAgreedToTerms(true);setShowTerms(false);}} lesseeName={form.name} lesseePhone={form.phone}/>}
      <div style={{textAlign:"center",marginBottom:"22px"}}>
        <img src="https://i.ibb.co/pjfhYTwk/487760766-580787241685933-7125488718656481255-n.jpg" alt="Sven's Rent-A-Car" style={{width:"90px",height:"90px",borderRadius:"50%",objectFit:"cover",marginBottom:"10px",border:"3px solid rgba(255,255,255,0.2)"}}/>
        <h1 style={{color:"#fff",fontSize:"22px",fontWeight:800,margin:0}}>Sven's Rent-A-Car</h1>
        <p style={{color:"rgba(255,255,255,0.45)",margin:"4px 0 0",fontSize:"13px"}}>Your Partner on the Road 🚗</p>
        <p style={{color:"rgba(255,255,255,0.35)",margin:"4px 0 0",fontSize:"12px"}}>Step {step} of {TOTAL_STEPS}</p>
      </div>
      <div style={{width:"100%",maxWidth:"560px",height:"4px",background:"rgba(255,255,255,0.1)",borderRadius:"99px",marginBottom:"20px",overflow:"hidden"}}>
        <div style={{height:"100%",width:`${progress}%`,background:"linear-gradient(90deg,#a78bfa,#7c3aed)",borderRadius:"99px",transition:"width 0.4s"}}/>
      </div>
      <Card>
        {step===1&&<>
          <StepTitle title="Kailan ang rental mo?" sub="Set your pick-up and return date & time"/>
          <div style={{display:"flex",flexDirection:"column",gap:"16px"}}>
            {[
              {label:"📍 Start",color:"#a78bfa",dk:"startDate",tk:"startTime",minD:today(),onD:v=>{set("startDate",v);if(form.endDate&&v>form.endDate)set("endDate","");}},
              {label:"🏁 Return",color:"#34d399",dk:"endDate",tk:"endTime",minD:form.startDate||today(),onD:v=>set("endDate",v)},
            ].map(({label,color,dk,tk,minD,onD})=>(
              <div key={dk} style={{background:"rgba(255,255,255,0.04)",borderRadius:"14px",padding:"16px",display:"flex",flexDirection:"column",gap:"10px",width:"100%",boxSizing:"border-box"}}>
                <span style={{color,fontSize:"12px",fontWeight:700,letterSpacing:"0.08em",textTransform:"uppercase"}}>{label}</span>
                <div className="dt-grid">
                  <div><label style={lbl}>Date</label><input type="date" min={minD} value={form[dk]} onChange={e=>onD(e.target.value)} style={inp} onFocus={hi} onBlur={lo}/></div>
                  <div><label style={lbl}>Time</label><input type="time" value={form[tk]} onChange={e=>set(tk,e.target.value)} style={inp} onFocus={hi} onBlur={lo}/></div>
                </div>
              </div>
            ))}
            {endBeforeStart&&<Pill c="#f87171" bg="rgba(248,113,113,0.1)" b="rgba(248,113,113,0.3)">⚠️ Return must be after pick-up.</Pill>}
            {isPastDateTime(form.startDate,form.startTime)&&!endBeforeStart&&<Pill c="#f87171" bg="rgba(248,113,113,0.1)" b="rgba(248,113,113,0.3)">⚠️ Pick-up date & time must be in the future.</Pill>}
            {duration&&!endBeforeStart&&!isPastDateTime(form.startDate,form.startTime)&&<Pill c="#34d399" bg="rgba(52,211,153,0.1)" b="rgba(52,211,153,0.25)">⏱️ Duration: <strong>{duration}</strong></Pill>}
          </div>
        </>}

        {step===2&&<>
          <StepTitle title="Piliin ang sasakyan" sub={`Availability for ${formatDT(form.startDate,form.startTime)} → ${formatDT(form.endDate,form.endTime)}`}/>
          <div style={{display:"flex",flexDirection:"column",gap:"10px"}}>
            {CARS.map(car=>{
              const booked=unavailableCars.has(car.id),chosen=form.car===car.id;
              return(<div key={car.id} onClick={()=>!booked&&set("car",car.id)}
                style={{display:"flex",alignItems:"center",gap:"14px",padding:"14px 18px",borderRadius:"14px",border:`2px solid ${chosen?"#a78bfa":booked?"rgba(255,255,255,0.05)":"rgba(255,255,255,0.09)"}`,background:chosen?"rgba(167,139,250,0.13)":booked?"rgba(255,255,255,0.02)":"rgba(255,255,255,0.03)",cursor:booked?"not-allowed":"pointer",opacity:booked?0.45:1,transition:"all 0.2s"}}>
                <span style={{fontSize:"28px"}}>{car.icon}</span>
                <div style={{flex:1}}><div style={{color:"#fff",fontWeight:700,fontSize:"15px"}}>{car.name}</div><div style={{color:"rgba(255,255,255,0.4)",fontSize:"12px",marginTop:"2px"}}>{car.type} · {car.seats}</div></div>
                {booked?<Badge c="#f87171" bg="rgba(248,113,113,0.12)">BOOKED</Badge>:chosen?<span style={{color:"#a78bfa",fontSize:"20px"}}>✓</span>:<Badge c="#34d399" bg="rgba(52,211,153,0.1)">AVAILABLE</Badge>}
              </div>);
            })}
          </div>
        </>}

        {step===3&&<>
          <StepTitle title="Delivery or Pick-up?" sub="Piliin kung paano ninyo kukuhanin ang sasakyan"/>
          <div style={{display:"flex",flexDirection:"column",gap:"10px",marginBottom:"20px"}}>
            {[{val:"pickup",icon:"🏢",title:"Pick-up",desc:"Kunin ang sasakyan sa San Pedro, Laguna"},{val:"delivery",icon:"🚚",title:"Delivery",desc:"Ipapadala namin sa inyong address"}].map(opt=>{
              const chosen=form.deliveryType===opt.val;
              return(<div key={opt.val} onClick={()=>set("deliveryType",opt.val)}
                style={{display:"flex",alignItems:"center",gap:"14px",padding:"16px 18px",borderRadius:"14px",border:`2px solid ${chosen?"#a78bfa":"rgba(255,255,255,0.09)"}`,background:chosen?"rgba(167,139,250,0.13)":"rgba(255,255,255,0.03)",cursor:"pointer",transition:"all 0.2s"}}>
                <span style={{fontSize:"30px"}}>{opt.icon}</span>
                <div style={{flex:1}}><div style={{color:"#fff",fontWeight:700,fontSize:"15px"}}>{opt.title}</div><div style={{color:"rgba(255,255,255,0.4)",fontSize:"12px",marginTop:"2px"}}>{opt.desc}</div></div>
                {chosen&&<span style={{color:"#a78bfa",fontSize:"20px"}}>✓</span>}
              </div>);
            })}
          </div>
          {form.deliveryType==="delivery"&&(
            <div style={{display:"flex",flexDirection:"column",gap:"12px"}}>
              <div><label style={lbl}>Delivery Address</label><input type="text" placeholder="e.g. 123 Rizal St, Biñan, Laguna" value={form.deliveryAddress} onChange={e=>set("deliveryAddress",e.target.value)} style={inp} onFocus={hi} onBlur={lo}/></div>
              <Pill c="#f59e0b" bg="rgba(245,158,11,0.1)" b="rgba(245,158,11,0.3)">📋 Actual delivery fee will be confirmed by the car rental owner after booking.</Pill>
            </div>
          )}
          {form.deliveryType==="pickup"&&<Pill c="#34d399" bg="rgba(52,211,153,0.08)" b="rgba(52,211,153,0.2)">📍 Pick-up location: <strong>20 T Agoncillo St, Pacita 1, San Pedro, Laguna</strong></Pill>}
        </>}

        {step===4&&<>
          <StepTitle title="Saan kayo pupunta?" sub="Ilagay ang city/municipality ng destination"/>
          <div style={{display:"flex",gap:"8px",marginBottom:"14px"}}>
            <input type="text" placeholder="e.g. Tagaytay City, Batangas City, Marikina..." value={destInput} onChange={e=>setDestInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addDest()} style={{...inp,flex:1}} onFocus={hi} onBlur={lo}/>
            <button onClick={addDest} style={{background:"linear-gradient(135deg,#a78bfa,#7c3aed)",border:"none",color:"#fff",padding:"0 18px",borderRadius:"12px",fontSize:"20px",cursor:"pointer",fontWeight:700}}>+</button>
          </div>
          {form.destinations.length===0
            ?<p style={{color:"rgba(255,255,255,0.25)",fontSize:"13px",textAlign:"center",padding:"16px 0"}}>Wala pang destination. Magdagdag ng kahit isa.</p>
            :<div style={{display:"flex",flexDirection:"column",gap:"8px",marginBottom:"16px"}}>
              {form.destinations.map((d,i)=>{
                const pd=zoneState.perDest?.find(x=>x.name.toLowerCase()===d.toLowerCase());
                const zi=pd?ZONE_INFO[pd.zone]:null;
                return(<div key={i} style={{display:"flex",alignItems:"center",gap:"10px",background:"rgba(167,139,250,0.08)",border:"1px solid rgba(167,139,250,0.2)",borderRadius:"10px",padding:"11px 14px"}}>
                  <span style={{color:"#a78bfa"}}>📌</span>
                  <span style={{color:"#fff",fontWeight:600,fontSize:"14px",flex:1}}>{d}</span>
                  {zi&&<span style={{background:`${zi.color}22`,color:zi.color,fontSize:"11px",fontWeight:700,padding:"3px 8px",borderRadius:"99px",whiteSpace:"nowrap"}}>{zi.label}</span>}
                  <button onClick={()=>removeDest(i)} style={{background:"rgba(248,113,113,0.15)",border:"none",color:"#f87171",width:"26px",height:"26px",borderRadius:"50%",cursor:"pointer",fontSize:"13px",fontWeight:700}}>✕</button>
                </div>);
              })}
            </div>
          }
          {form.destinations.length>0&&<>
            {zoneState.loading&&<Pill c="#a78bfa" bg="rgba(167,139,250,0.1)" b="rgba(167,139,250,0.25)">🔍 Detecting zone and computing rate...</Pill>}
            {zoneState.error&&<Pill c="#f87171" bg="rgba(248,113,113,0.1)" b="rgba(248,113,113,0.3)">⚠️ {zoneState.error}</Pill>}
            {!zoneState.loading&&zoneInfo&&(
              <div style={{background:"rgba(255,255,255,0.04)",border:`1px solid ${zoneInfo.color}44`,borderRadius:"16px",padding:"18px",display:"flex",flexDirection:"column",gap:"12px"}}>
                <div style={{display:"flex",alignItems:"center",gap:"10px"}}>
                  <span style={{background:`${zoneInfo.color}22`,color:zoneInfo.color,fontWeight:800,fontSize:"13px",padding:"4px 12px",borderRadius:"99px"}}>{zoneInfo.label}</span>
                  <span style={{color:"rgba(255,255,255,0.4)",fontSize:"12px"}}>{zoneInfo.desc}</span>
                </div>
                {rentalFee?.available===false
                  ?<Pill c="#f87171" bg="rgba(248,113,113,0.1)" b="rgba(248,113,113,0.3)">⚠️ Ang <strong>Celerio</strong> ay hindi available para sa Zone 5. Bumalik at pumili ng ibang sasakyan.</Pill>
                  :rentalFee?.available&&(
                    <div style={{borderTop:`1px solid ${zoneInfo.color}33`,paddingTop:"12px",display:"flex",flexDirection:"column",gap:"6px"}}>
                      <p style={{color:"rgba(255,255,255,0.4)",fontSize:"12px",margin:"0 0 4px",fontWeight:600,textTransform:"uppercase",letterSpacing:"0.06em"}}>💰 Estimated Rental Fee</p>
                      {rentalFee.items.map((item,i)=>(<div key={i} style={{display:"flex",justifyContent:"space-between",fontSize:"13px"}}><span style={{color:"rgba(255,255,255,0.45)"}}>{item.l}</span><span style={{color:"#fff",fontWeight:600}}>₱{item.a.toLocaleString()}</span></div>))}
                      <div style={{borderTop:"1px solid rgba(255,255,255,0.1)",paddingTop:"10px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                        <span style={{color:"rgba(255,255,255,0.6)",fontSize:"14px",fontWeight:700}}>Total</span>
                        <span style={{fontSize:"22px",fontWeight:800,color:zoneInfo.color}}>₱{rentalFee.total.toLocaleString()}</span>
                      </div>
                      <p style={{color:"rgba(255,255,255,0.25)",fontSize:"11px",margin:0}}>✅ Unlimited mileage · Estimate only, subject to confirmation</p>
                    </div>
                  )
                }
              </div>
            )}
          </>}
          <p style={{color:"rgba(255,255,255,0.2)",fontSize:"12px",marginTop:"12px"}}>💡 Ilagay ang city o municipality para mas accurate ang rate computation. (e.g. "Lucena City, Quezon" hindi lang "Lucena")</p>
        </>}

        {step===5&&<>
          <StepTitle title="Ano ang iyong impormasyon?" sub="Para makontak ka namin para sa confirmation"/>
          <div style={{display:"flex",flexDirection:"column",gap:"16px"}}>
            {[["Full Name","name","Juan Dela Cruz","text"],["Phone Number","phone","09XX XXX XXXX","tel"]].map(([l,k,ph,t])=>(
              <div key={k}><label style={lbl}>{l}</label><input type={t} placeholder={ph} value={form[k]} onChange={e=>set(k,e.target.value)} style={inp} onFocus={hi} onBlur={lo}/></div>
            ))}
            <div><label style={lbl}>Additional Notes <span style={{opacity:0.4}}>(optional)</span></label><textarea placeholder="e.g. Special requests..." value={form.notes} onChange={e=>set("notes",e.target.value)} rows={3} style={{...inp,resize:"none"}} onFocus={hi} onBlur={lo}/></div>
          </div>
        </>}

        {step===6&&<>
          <StepTitle title="Tama ba ang lahat? ✅" sub="Review your booking before confirming"/>
          <div style={{background:"rgba(167,139,250,0.08)",border:"1px solid rgba(167,139,250,0.2)",borderRadius:"12px",padding:"12px 16px",marginBottom:"16px",fontSize:"13px",color:"rgba(255,255,255,0.7)",lineHeight:1.6}}>
            👋 Almost there! Kindly read our <strong style={{color:"#a78bfa"}}>Terms & Conditions</strong> before proceeding. Your agreement is required to complete your booking.
          </div>
          <SummaryBox rows={summaryRows}/>
          <div style={{marginTop:"16px",background:"rgba(255,255,255,0.04)",border:`1px solid ${agreedToTerms?"rgba(167,139,250,0.4)":"rgba(255,255,255,0.1)"}`,borderRadius:"12px",padding:"14px 16px",display:"flex",alignItems:"center",gap:"12px",cursor:"pointer"}} onClick={()=>!agreedToTerms&&setShowTerms(true)}>
            <span style={{fontSize:"20px"}}>{agreedToTerms?"✅":"📋"}</span>
            <span style={{color:agreedToTerms?"#a78bfa":"rgba(255,255,255,0.7)",fontSize:"13px",lineHeight:1.5}}>
              {agreedToTerms
                ? "I have read and agreed to the Terms & Conditions of Sven's Rent-A-Car."
                : <span>Tap here to read and agree to the <strong style={{color:"#a78bfa",textDecoration:"underline"}}>Terms & Conditions</strong> of Sven's Rent-A-Car.</span>
              }
            </span>
          </div>
        </>}

        <div style={{display:"flex",gap:"10px",marginTop:"28px"}}>
          {step>1&&<button onClick={()=>setStep(s=>s-1)} style={{flex:1,padding:"13px",borderRadius:"50px",border:"2px solid rgba(255,255,255,0.13)",background:"transparent",color:"#fff",fontSize:"14px",fontWeight:600,cursor:"pointer"}}>← Back</button>}
          <button onClick={()=>step===TOTAL_STEPS?handleConfirm():setStep(s=>s+1)} disabled={!canNext()||submitting}
            style={{flex:2,padding:"13px",borderRadius:"50px",border:"none",background:canNext()&&!submitting?"linear-gradient(135deg,#a78bfa,#7c3aed)":"rgba(255,255,255,0.08)",color:canNext()&&!submitting?"#fff":"rgba(255,255,255,0.25)",fontSize:"15px",fontWeight:700,cursor:canNext()&&!submitting?"pointer":"not-allowed",transition:"all 0.2s"}}>
            {submitting?"Sending...":step===TOTAL_STEPS?"Confirm Booking 🎉":"Continue →"}
          </button>
        </div>
      </Card>
      <p style={{color:"rgba(255,255,255,0.15)",fontSize:"12px",marginTop:"16px"}}>© Sven's Rent-A-Car · San Pedro, Laguna</p>
    </Wrap>
  );
}

function Wrap({children}){return<div style={{minHeight:"100vh",background:"linear-gradient(135deg,#1a1a2e,#16213e,#0f3460)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"16px",boxSizing:"border-box",width:"100%",minWidth:0}}>{children}</div>;}
function Card({children}){return<div style={{background:"rgba(255,255,255,0.07)",backdropFilter:"blur(20px)",borderRadius:"24px",padding:"24px",width:"100%",maxWidth:"560px",boxSizing:"border-box",border:"1px solid rgba(255,255,255,0.1)",overflow:"hidden",minWidth:0}}>{children}</div>;}
function StepTitle({title,sub}){return<div style={{marginBottom:"20px"}}><h2 style={{color:"#fff",fontSize:"20px",fontWeight:700,margin:"0 0 5px"}}>{title}</h2><p style={{color:"rgba(255,255,255,0.38)",fontSize:"13px",margin:0,lineHeight:1.5}}>{sub}</p></div>;}
function SummaryBox({rows}){return<div style={{background:"rgba(167,139,250,0.08)",border:"1px solid rgba(167,139,250,0.2)",borderRadius:"16px",padding:"20px",display:"flex",flexDirection:"column",gap:"12px"}}>{rows.map(([l,v])=><div key={l} style={{display:"flex",justifyContent:"space-between",gap:"16px",fontSize:"13px"}}><span style={{color:"rgba(255,255,255,0.4)",whiteSpace:"nowrap"}}>{l}</span><span style={{color:"#fff",fontWeight:600,textAlign:"right"}}>{v}</span></div>)}</div>;}
function Pill({children,c,bg,b}){return<div style={{background:bg,border:`1px solid ${b}`,borderRadius:"12px",padding:"12px 16px",color:c,fontSize:"13px",fontWeight:600,lineHeight:1.5}}>{children}</div>;}
function Badge({children,c,bg}){return<span style={{background:bg,color:c,fontSize:"11px",fontWeight:700,padding:"4px 10px",borderRadius:"99px"}}>{children}</span>;}
function Row({l,v}){return<div style={{display:"flex",justifyContent:"space-between",fontSize:"13px"}}><span style={{color:"rgba(255,255,255,0.45)"}}>{l}</span><span style={{color:"#fff",fontWeight:600,textAlign:"right"}}>{v}</span></div>;}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
