<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sven’s Rent-a-Car — Booking</title>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
body{font-family:system-ui;background:#1a1a2e;margin:0;color:#fff}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#222;color:#fff}
button{padding:12px;border:none;border-radius:999px;background:#7c3aed;color:#fff;font-weight:bold;cursor:pointer}
.card{max-width:500px;margin:auto;background:#111;padding:25px;border-radius:20px}
</style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">

const {useState} = React;

const DELIVERY_FEES = {
  Laguna: 0,
  Alabang: 300,
  Makati: 800,
  BGC: 1000,
  QC: 1200
};

function App(){
  const [step,setStep]=useState(1);

  const [form,setForm]=useState({
    startDate:"",
    endDate:"",
    car:"",
    deliveryType:"",
    deliveryArea:"",
    deliveryAddress:"",
    name:"",
    phone:""
  });

  const set=(k,v)=>setForm(f=>({...f,[k]:v}));

  const totalFee = form.deliveryArea ? DELIVERY_FEES[form.deliveryArea]*2 : 0;

  return(
    <div className="card">

      <h2>🚗 Sven’s Rent-a-Car</h2>
      <p>Step {step} of 4</p>

      {/* STEP 1 */}
      {step===1 && <>
        <h3>Rental Date</h3>
        <input type="date" onChange={e=>set("startDate",e.target.value)} />
        <br/><br/>
        <input type="date" onChange={e=>set("endDate",e.target.value)} />
      </>}

      {/* STEP 2 */}
      {step===2 && <>
        <h3>Select Car</h3>
        <select onChange={e=>set("car",e.target.value)}>
          <option value="">Select</option>
          <option>Xpander</option>
          <option>Vios</option>
          <option>Celerio</option>
        </select>
      </>}

      {/* STEP 3 */}
      {step===3 && <>
        <h3>Delivery</h3>

        <select onChange={e=>set("deliveryType",e.target.value)}>
          <option value="">Select</option>
          <option value="pickup">Pick-up</option>
          <option value="delivery">Delivery</option>
        </select>

        {form.deliveryType==="delivery" && <>
          <br/><br/>

          <select onChange={e=>set("deliveryArea",e.target.value)}>
            <option value="">Select Area</option>
            <option value="Laguna">Laguna (FREE)</option>
            <option value="Alabang">Alabang (₱300)</option>
            <option value="Makati">Makati (₱800)</option>
            <option value="BGC">BGC (₱1000)</option>
            <option value="QC">QC (₱1200)</option>
          </select>

          <br/><br/>

          <input
            placeholder="Full address"
            onChange={e=>set("deliveryAddress",e.target.value)}
          />

          {form.deliveryArea && (
            <p>
              Delivery Fee: {totalFee===0 ? "FREE" : "₱"+totalFee}
            </p>
          )}
        </>}
      </>}

      {/* STEP 4 */}
      {step===4 && <>
        <h3>Your Info</h3>
        <input placeholder="Name" onChange={e=>set("name",e.target.value)} />
        <br/><br/>
        <input placeholder="Phone" onChange={e=>set("phone",e.target.value)} />
      </>}

      <br/>

      {step>1 && <button onClick={()=>setStep(step-1)}>Back</button>}
      {" "}
      {step<4 && <button onClick={()=>setStep(step+1)}>Next</button>}
      {step===4 && <button onClick={()=>alert("Booking submitted!")}>Submit</button>}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
